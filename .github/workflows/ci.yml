name: InkPage validation
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev libgl1-mesa-dev pkg-config
      - run: cargo fmt --check
      - run: python scripts/check_alignment.py
      - run: cargo clippy --locked -j1 --all-targets -- -D warnings
      - run: cargo test --locked -j1
      - run: cargo build --locked -j1

[package]
name = "rustpad"
version = "0.12.0"
edition = "2024"
license = "MIT"
description = "A compact original desktop text editor"

[dependencies]
eframe = { version = "=0.33.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "=0.15.4"
tempfile = "=3.23.0"
png = "=0.18.1"
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "dump-load", "regex-onig"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-onig"] }
unicode-width = "=0.2.2"
regex = "=1.13.1"
unicode-segmentation = "=1.13.3"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "=0.6.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
windows-sys = { version = "=0.61.2", features = ["Win32_System_Memory"] }

[profile.release]
opt-level = "s"
codegen-units = 1
lto = "thin"
strip = true

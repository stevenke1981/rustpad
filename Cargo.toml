[package]
name = "rustpad"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A compact original desktop text editor"

[dependencies]
eframe = { version = "=0.33.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "=0.15.4"
tempfile = "=3.23.0"
png = "=0.18.1"

[profile.release]
lto = "thin"
strip = true
